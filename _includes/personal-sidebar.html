<aside class="profile-sidebar" id="contact" aria-labelledby="sidebar-contact-title">
  <img class="sidebar-photo" src="{{ '/images/ruiwen-photo.jpg' | relative_url }}" alt="{{ ui.sidebar_photo_alt | escape }}" width="1080" height="1440" decoding="async">
  <div class="sidebar-contact">
    <h2 class="sidebar-title" id="sidebar-contact-title">{{ ui.sidebar_contact_title }}</h2>
    <ul class="sidebar-links">
      <li>
        <a class="sidebar-link sidebar-link--email" href="mailto:{{ profile.email | escape }}">
          <svg class="sidebar-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
          <span class="sidebar-link-copy"><small class="sidebar-link-label">{{ ui.email_label }}</small><span class="sidebar-link-detail">{{ profile.email }}</span></span>
        </a>
      </li>
      {% for link in profile.links %}
      <li>
        <a class="sidebar-link" href="{{ link.url | escape }}" target="_blank" rel="noopener noreferrer">
          {% if link.label == 'GitHub' %}
          <svg class="sidebar-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 .75a11.25 11.25 0 0 0-3.558 21.924c.563.103.769-.244.769-.542 0-.267-.01-.974-.015-1.911-3.13.68-3.79-1.509-3.79-1.509-.512-1.3-1.25-1.646-1.25-1.646-1.022-.699.078-.684.078-.684 1.13.08 1.726 1.16 1.726 1.16 1.005 1.723 2.637 1.225 3.28.937.102-.728.393-1.225.714-1.507-2.499-.284-5.126-1.25-5.126-5.565 0-1.23.44-2.234 1.16-3.022-.116-.285-.503-1.43.11-2.98 0 0 .945-.303 3.094 1.154A10.78 10.78 0 0 1 12 6.18c.955.005 1.917.13 2.815.379 2.147-1.457 3.09-1.154 3.09-1.154.615 1.55.228 2.695.112 2.98.722.788 1.158 1.792 1.158 3.022 0 4.326-2.631 5.277-5.138 5.556.404.35.764 1.04.764 2.096 0 1.513-.014 2.735-.014 3.107 0 .301.203.65.774.54A11.252 11.252 0 0 0 12 .75Z"></path></svg>
          {% else %}
          <svg class="sidebar-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"></path><path d="M14 3v6h6M8 13h8M8 17h6"></path></svg>
          {% endif %}
          <span class="sidebar-link-copy">{{ link.label }}</span>
        </a>
      </li>
      {% endfor %}
      {% if profile.xiaohongshu and profile.xiaohongshu != '' %}
      <li>
        <a class="sidebar-link sidebar-link--xiaohongshu" href="{{ profile.xiaohongshu | escape }}" target="_blank" rel="noopener noreferrer" aria-label="{{ ui.xiaohongshu_label | escape }}">
          <img class="sidebar-xiaohongshu-badge" src="{{ '/images/icons/xiaohongshu.png' | relative_url }}" alt="" width="690" height="483" aria-hidden="true">
        </a>
      </li>
      {% endif %}
    </ul>
    <div class="sidebar-copy-row">
      <button class="copy-email" type="button" data-copy-email="{{ profile.email | escape }}" data-copy-success="{{ ui.copy_success | escape }}" data-copy-failure="{{ ui.copy_failure | escape }}" hidden>{{ ui.copy_email }} <span aria-hidden="true">⧉</span></button>
      <span class="copy-status" role="status" aria-live="polite"></span>
    </div>
  </div>
</aside>
