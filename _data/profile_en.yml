research:
  - number: "01"
    title: AI For Game
    description: I explore generative AI technologies, including video generation and 3D character animation generation, and their applications in game content creation and asset production, aiming to make game development pipelines more intelligent and reshape how they work.
    tags: [Video generation, 3D character animation generation, Generative AI]
  - number: "02"
    title: AI In Game
    description: I explore how large language models, reinforcement learning and agent technologies can enable natural interaction, dynamic decision-making and autonomous behavior in NPCs, with the aim of creating more intelligent and lifelike game characters.
    tags: [Large language models, Reinforcement learning, Agents, Intelligent NPCs]
